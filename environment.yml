# Conda environment for the WES variant-calling benchmark.
# Create with:   conda env create -f environment.yml
# Activate with: conda activate vcbench
#
# DeepVariant and Strelka2 are best run from their official containers (Singularity
# or Docker) — they are not installed via conda here. See scripts/05 and 06.

name: vcbench
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Alignment + BAM handling
  - bwa-mem2=2.2.1
  - samtools=1.20
  - picard=3.1.1

  # Variant callers (the ones that install cleanly via conda)
  - gatk4=4.5.0.0
  - bcftools=1.20
  - freebayes=1.3.7

  # Evaluation
  - hap.py=0.3.15
  - rtg-tools=3.12.1            # provides `rtg vcfeval`

  # Utilities
  - tabix=1.11
  - bedtools=2.31.1
  - parallel=20240522

  # Aggregation / plotting
  - python=3.11
  - pandas=2.2
  - matplotlib=3.8
  - seaborn=0.13
  - numpy=1.26

  # Container runtimes (install one of these on your system, not via conda)
  # singularity, docker
